[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preflight-check-skill"
version = "1.1.0"
description = "Defensive toolkit to prevent secrets and PII from leaking into Claude Code conversations"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Konrad Dzbik" }]
keywords = ["claude", "claude-code", "redaction", "pii", "secrets", "security", "gdpr", "rodo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
]

[project.scripts]
preflight-check = "core.cli:main"

[project.urls]
Homepage = "https://github.com/konraddzbik/preflight-check-skill"
Issues = "https://github.com/konraddzbik/preflight-check-skill/issues"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.setuptools.package-data]
core = ["catalog.yaml", "gitleaks.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
